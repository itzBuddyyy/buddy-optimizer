name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release and upload the installer

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # electron-builder uploads the installer, its blockmap and latest.yml in
      # parallel; if the release does not exist yet, two uploads both try to
      # create it and one fails ("already_exists"). Creating the draft first
      # removes that race.
      - name: Create draft release
        shell: pwsh
        run: |
          gh release view $env:TAG --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --repo ${{ github.repository }} --draft --title "Buddy Optimizer $($env:TAG.TrimStart('v'))" --notes "Download Buddy-Optimizer-Setup-$($env:TAG.TrimStart('v')).exe below and run it."
          }

      - name: Build and upload installer
        run: npm run release

      - name: Check assets and publish release
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          $names = gh release view $env:TAG --repo ${{ github.repository }} --json assets --jq '.assets[].name'
          foreach ($want in @("Buddy-Optimizer-Setup-$v.exe", "Buddy-Optimizer-Setup-$v.exe.blockmap", 'latest.yml')) {
            if ($names -notcontains $want) { throw "missing release asset: $want" }
          }
          gh release edit $env:TAG --repo ${{ github.repository }} --draft=false --latest
